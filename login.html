<body>
    <main>
        <div class="login-wrapper">
            <div class="login-box">

                <h2>User Login</h2>

                <div class="input-group">
                    <input type="email" id="email" required>
                    <label>Email Address</label>
                </div>

                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required>
                    <span class="toggle-eye" onclick="togglePassword()">👁️</span>
                  </div>
                  

                <button onclick="loginUser()" class="login-btn">Login</button>

                <p id="msg"></p>

                <p class="signup-text">
                    New user? <a href="registration.html">Create an account</a>
                </p>

            </div>
        </div>
    </main>

    <footer class="flex-all-center">
        <p>Copyright © Shreyash HK</p>
    </footer>

    <script>
        function loginUser() {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
            let msg = document.getElementById("msg");

            if (email === "" || password === "") {
                msg.innerHTML = "All fields are required.";
                msg.style.color = "red";
                return;
            }

            fetch("http://localhost/Flipcart_clone/api/login.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        msg.style.color = "green";
                        msg.innerHTML = "Login successful!";
                        localStorage.setItem("user", JSON.stringify(data.user));

                        setTimeout(() => window.location.href = "home.html", 800);
                    } else {
                        msg.style.color = "red";
                        msg.innerHTML = data.message;
                    }
                })
                .catch(() => {
                    msg.style.color = "red";
                    msg.innerHTML = "API Error!";
                });
        }

        function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}
    </script>

</body>
