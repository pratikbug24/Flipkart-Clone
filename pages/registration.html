<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone – Register</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/registration.css">
</head>

<body>
    <header class="header">
        <div class="header-left">
            <a href="index.html" class="logo">Flipkart</a>
            <span class="explore">Explore <span class="plus">Plus+</span></span>
        </div>

        <div class="header-right">
            <a href="login.html" class="header-btn">Login</a>
            <a href="cart.html" class="header-link">Cart</a>
            <a href="#" class="header-link">More</a>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <h2>Create Account</h2>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Mobile Number</label>
                <input type="text" id="mobile" maxlength="10" placeholder="Enter mobile number">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <span class="eye-icon" onclick="togglePassword()">👁️</span>
            </div>

            <button onclick="registerUser()">Register</button>

            <div class="login-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </main>

    <footer class="flex-all-center">
        <p>Copyright © Shreyash HK</p>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/registration.js"></script>
</body>

</html>
