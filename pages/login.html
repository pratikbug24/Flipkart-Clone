<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Flipkart Clone</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utils.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <main>
        <div class="login-wrapper">
            <div class="login-box">
                <h2>User Login</h2>

                <div class="input-group">
                    <input type="email" id="email" required>
                    <label>Email Address</label>
                </div>

                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required>
                    <span class="toggle-eye" onclick="togglePassword()">👁️</span>
                </div>

                <button onclick="loginUser()" class="login-btn">Login</button>

                <p id="msg"></p>

                <p class="signup-text">
                    New user? <a href="registration.html">Create an account</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="flex-all-center">
        <p>Copyright © Shreyash HK</p>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
