<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Flipcart Clone</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-roboto">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center p-4">
            <div class="text-2xl font-bold">
                Flipcart Clone
            </div>
            <div class="flex items-center space-x-4">
                <span class="hidden md:block">Hello, <strong id="userName">User</strong></span>
                <div class="relative">
                    <button id="profileBtn" class="flex items-center space-x-2 focus:outline-none">
                        <img src="https://via.placeholder.com/35" alt="Profile" class="rounded-full">
                        <span class="md:hidden">Profile</span>
                    </button>
                    <!-- Dropdown -->
                    <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-40 bg-white text-black rounded shadow-lg">
                        <a href="#" class="block px-4 py-2 hover:bg-gray-200">My Account</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-200">Orders</a>
                        <a href="#" class="block px-4 py-2 hover:bg-gray-200">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto mt-6">
        <!-- Hero / Banner -->
        <section class="bg-white rounded shadow p-6 mb-6">
            <h1 class="text-3xl font-bold mb-4">Welcome to Flipcart Clone</h1>
            <p class="text-gray-700">Shop your favorite products at the best prices.</p>
        </section>

        <!-- Product Grid -->
        <section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Example Product -->
            <div class="bg-white rounded shadow p-4">
                <img src="https://via.placeholder.com/200" alt="Product" class="w-full mb-4 rounded">
                <h2 class="text-lg font-semibold">Product Name</h2>
                <p class="text-gray-600">$99.99</p>
                <button class="mt-2 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Add to Cart</button>
            </div>

            <!-- Repeat product cards as needed -->
            <div class="bg-white rounded shadow p-4">
                <img src="https://via.placeholder.com/200" alt="Product" class="w-full mb-4 rounded">
                <h2 class="text-lg font-semibold">Product Name</h2>
                <p class="text-gray-600">$49.99</p>
                <button class="mt-2 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Add to Cart</button>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-10 p-6 text-center">
        &copy; 2025 Flipcart Clone. All rights reserved.
    </footer>

    <!-- JS for Profile Dropdown -->
    <script>
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');

        profileBtn.addEventListener('click', () => {
            profileDropdown.classList.toggle('hidden');
        });
console.log(userName);
        // Optional: Close dropdown when clicking outside
        window.addEventListener('click', (e) => {
            if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                profileDropdown.classList.add('hidden');
            }
        });

        // Example: Set username dynamically
        document.getElementById('userName').textContent = "Pratik";
    </script>

</body>
</html>
