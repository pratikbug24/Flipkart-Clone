<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="CSS/style.css">

    <style>
        body { background:#f1f3f6; font-family:Arial; }
        .product-box {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            display: flex;
            gap: 40px;
            border-radius: 10px;
        }
        img {
            width: 300px;
            object-fit: contain;
        }
        h2 { margin-bottom: 10px; }
        .price { color:#2874f0; font-size: 22px; font-weight:bold; }
        button {
            margin-top: 20px;
            padding: 12px;
            width: 200px;
            background: #ff9f00;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="product-box">
    <img id="pImage">
    <div>
        <h2 id="pName"></h2>
        <p class="price">₹<span id="pPrice"></span></p>
        <p id="pDesc"></p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    let currentProduct = null;

    fetch("http://localhost/Flipcart_clone/api/get_product_by_id.php?id=" + productId)
        .then(res => res.json())
        .then(data => {
            currentProduct = data.product;
            document.getElementById("pName").innerText = currentProduct.name;
            document.getElementById("pPrice").innerText = currentProduct.price;
            document.getElementById("pDesc").innerText = currentProduct.description;
            document.getElementById("pImage").src =
                "http://localhost/Flipcart_clone/uploads/" + currentProduct.image;
        });

    function addToCart() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const exists = cart.find(p => p.id === currentProduct.id);

        if (exists) {
            exists.qty += 1;
        } else {
            cart.push({ ...currentProduct, qty: 1 });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        alert("Product added to cart");
    }
</script>

</body>
</html>
